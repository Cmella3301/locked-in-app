version: '3.8'

services:
  lock-in:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lock-in-app
    ports:
      - "3001:3001"
    volumes:
      - ./data:/app/data
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 3001
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      APP_PASSWORD: ${APP_PASSWORD}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-}
      SESSION_SECRET: ${SESSION_SECRET:-}
    restart: unless-stopped

  lock-in-gf:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lock-in-app-gf
    ports:
      - "3333:3001"
    volumes:
      - ./data-gf:/app/data
      - ./public/icons-gf:/app/public/icons
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 3001
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      APP_PASSWORD: ${APP_PASSWORD}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-}
      SESSION_SECRET: ${SESSION_SECRET:-}
    restart: unless-stopped

  dozzle:
    container_name: dozzle
    image: amir20/dozzle:latest
    profiles: ["observability"]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    ports:
      - 8080:8080
    restart: unless-stopped

  zabbix:
    image: zabbix/zabbix-appliance:latest
    container_name: zabbix-appliance
    profiles: ["observability"]
    ports:
      - "8082:80"
      - "10051:10051"
    environment:
      - PHP_TZ="America/New_York"
    restart: unless-stopped
