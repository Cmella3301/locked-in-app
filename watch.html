<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>LOCK-IN Watch</title>
    <style>
        :root {
            --bg: #000;
            --accent: #00f2ff;
            --text: #fff;
            --card-bg: #111;
        }
        body {
            margin: 0;
            padding: 8px;
            background: var(--bg);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            gap: 10px;
            overflow-x: hidden;
        }
        .header {
            text-align: center;
            font-weight: 800;
            font-size: 0.8rem;
            color: var(--accent);
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 5px;
        }
        .grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 8px;
        }
        .btn {
            background: var(--card-bg);
            border: 1px solid #333;
            border-radius: 12px;
            padding: 15px 10px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            transition: all 0.2s;
            -webkit-tap-highlight-color: transparent;
        }
        .btn:active {
            transform: scale(0.95);
            background: #222;
        }
        .btn.met {
            border-color: var(--accent);
            box-shadow: 0 0 10px rgba(0, 242, 255, 0.2);
        }
        .icon {
            font-size: 1.5rem;
        }
        .info {
            flex: 1;
            margin-left: 10px;
            text-align: left;
        }
        .label {
            font-size: 0.9rem;
            font-weight: 600;
        }
        .value {
            font-size: 0.7rem;
            opacity: 0.6;
        }
        .toast {
            position: fixed;
            bottom: 10px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--accent);
            color: #000;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.7rem;
            font-weight: bold;
            opacity: 0;
            transition: opacity 0.3s;
        }
    </style>
</head>
<body>
    <div class="header">LOCK-IN ⚔️</div>
    
    <div class="grid" id="watchGrid">
        <!-- Water -->
        <div class="btn" onclick="updateRing('water', 1)">
            <span class="icon">💧</span>
            <div class="info">
                <div class="label">Water</div>
                <div class="value" id="waterVal">0 / 8</div>
            </div>
        </div>

        <!-- Brush -->
        <div class="btn" id="brushBtn" onclick="toggleRing('brush')">
            <span class="icon">🪥</span>
            <div class="info">
                <div class="label">Brush Teeth</div>
                <div class="value" id="brushState">Incomplete</div>
            </div>
        </div>

        <!-- Floss -->
        <div class="btn" id="flossBtn" onclick="toggleRing('floss')">
            <span class="icon">🧵</span>
            <div class="info">
                <div class="label">Floss</div>
                <div class="value" id="flossState">Incomplete</div>
            </div>
        </div>

        <!-- Workout -->
        <div class="btn" id="workoutBtn" onclick="toggleRing('workout')">
            <span class="icon">🏋️‍♂️</span>
            <div class="info">
                <div class="label">Workout</div>
                <div class="value" id="workoutState">Incomplete</div>
            </div>
        </div>
    </div>

    <div id="toast" class="toast">LOCKED IN</div>

    <script>
        let S = null;

        async function refreshData() {
            try {
                const res = await fetch(`/api/state?t=${Date.now()}`, { cache: 'no-store' });
                const data = await res.json();
                if (data) {
                    S = data;
                    render();
                }
            } catch (e) {
                console.error("Wait for server...");
            }
        }

        function render() {
            if (!S) return;

            // Water (glasses of 250ml)
            const waterGlasses = Math.floor((S.water || 0) / 250);
            const goalGlasses = Math.floor((S.waterGoal || 2500) / 250);
            document.getElementById('waterVal').innerText = `${waterGlasses} / ${goalGlasses}`;
            
            // Brush (check if any brush habit is done today)
            const brushHabits = (S.habits || []).filter(h => h.name.includes('Brush'));
            const allBrushDone = brushHabits.length > 0 && brushHabits.every(h => h.done);
            const anyBrushDone = brushHabits.some(h => h.done);
            document.getElementById('brushState').innerText = allBrushDone ? 'COMPLETED' : (anyBrushDone ? 'PARTIAL' : 'INCOMPLETE');
            document.getElementById('brushBtn').classList.toggle('met', allBrushDone);

            // Floss
            const floss = (S.habits || []).find(h => h.name.includes('Floss')) || { done: false };
            document.getElementById('flossState').innerText = floss.done ? 'COMPLETED' : 'INCOMPLETE';
            document.getElementById('flossBtn').classList.toggle('met', floss.done);

            // Workout
            const workout = (S.habits || []).find(h => h.name.includes('Workout')) || { done: false };
            document.getElementById('workoutState').innerText = workout.done ? 'COMPLETED' : 'INCOMPLETE';
            document.getElementById('workoutBtn').classList.toggle('met', workout.done);
        }

        async function syncState() {
            try {
                await fetch('/api/state', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(S)
                });
                showToast();
                render();
            } catch(e) {
                console.error("Failed to sync:", e);
            }
        }

        async function updateRing(type, increment) {
            if (!S) return;
            if (type === 'water') {
                S.water = Math.min((S.water || 0) + 250, (S.waterGoal || 2500) * 1.5);
                if (S.water >= S.waterGoal && !S.waterHabitDone) {
                    S.xpToday += 20; S.totalXp += 20; S.waterHabitDone = true;
                }
            }
            await syncState();
        }

        async function toggleRing(type) {
            if (!S) return;
            
            let habitName = '';
            if (type === 'floss') habitName = 'Floss';
            if (type === 'workout') habitName = 'Workout';
            
            if (type === 'brush') {
                const brushHabits = (S.habits || []).filter(h => h.name.includes('Brush'));
                const nextIncomplete = brushHabits.find(h => !h.done);
                if (nextIncomplete) {
                    nextIncomplete.done = true;
                    S.xpToday += nextIncomplete.xp || 10;
                    S.totalXp += nextIncomplete.xp || 10;
                } else {
                    brushHabits.forEach(h => {
                        h.done = false;
                        S.xpToday = Math.max(0, S.xpToday - (h.xp || 10));
                        S.totalXp = Math.max(0, S.totalXp - (h.xp || 10));
                    });
                }
                await syncState();
                return;
            }

            const h = (S.habits || []).find(h => h.name.includes(habitName));
            if (h) {
                h.done = !h.done;
                if (h.done) {
                    S.xpToday += h.xp || 20;
                    S.totalXp += h.xp || 20;
                } else {
                    S.xpToday = Math.max(0, S.xpToday - (h.xp || 20));
                    S.totalXp = Math.max(0, S.totalXp - (h.xp || 20));
                }
            }
            await syncState();
        }

        function showToast() {
            const t = document.getElementById('toast');
            t.style.opacity = '1';
            setTimeout(() => t.style.opacity = '0', 1000);
        }

        refreshData();
        setInterval(refreshData, 5000);
    </script>
</body>
</html>
